# =============================================================================
# Docker Compose — PRODUCCIÓN
# Base de datos: PostgreSQL incluida en el stack (volumen persistente)
#
# Variables opcionales (valores por defecto entre paréntesis):
#   POSTGRES_DB       (diceroller)
#   POSTGRES_USER     (diceroller)
#   POSTGRES_PASSWORD (diceroller)  ← cámbiala en un despliegue real
#   BACKEND_WS_URL    (ws://localhost:8080/ws/room)
#   BACKEND_HTTP_URL  (vacío: se deriva del WebSocket)
#
# Variables obligatorias:
#   JWT_SECRET (clave HMAC-SHA256 de al menos 32 caracteres)
#
# Frontend:      http://localhost:80
# Backend:       http://localhost:8080
# =============================================================================
name: diceroller-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: diceroller-postgres-prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-diceroller}
      - POSTGRES_USER=${POSTGRES_USER:-diceroller}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-diceroller}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - diceroller-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diceroller-backend-prod
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_PROFILE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-diceroller}
      - DB_USER=${POSTGRES_USER:-diceroller}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-diceroller}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      - JAVA_OPTS_APPEND=-Xmx512m -Xms256m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diceroller-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diceroller-frontend-prod
    ports:
      - "80:80"
    environment:
      - BACKEND_WS_URL=${BACKEND_WS_URL:-ws://localhost:8080/ws/room}
      - BACKEND_HTTP_URL=${BACKEND_HTTP_URL:-}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - diceroller-net

volumes:
  postgres-data:

networks:
  diceroller-net:
    driver: bridge
