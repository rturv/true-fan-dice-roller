# =============================================================================
# Publica las imágenes de frontend y backend (nativo) en GitHub Container
# Registry cuando se empuja un tag de versión.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
#   -> ghcr.io/<owner>/true-fan-dice-roller-web:1.0.0  (+ 1.0, latest)
#   -> ghcr.io/<owner>/true-fan-dice-roller-ws:1.0.0   (+ 1.0, latest)
#
# `workflow_dispatch` permite probar el pipeline sin publicar una versión:
# en ese caso solo se publica la etiqueta `sha-<short>`.
#
# No necesita secrets: usa el GITHUB_TOKEN con permiso `packages: write`.
# =============================================================================
name: Release images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: Angular compilado y servido por nginx.
  # La URL del backend se inyecta en runtime (docker-entrypoint.sh + envsubst),
  # así que la imagen es la misma para cualquier entorno.
  # ---------------------------------------------------------------------------
  web:
    name: Frontend (nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/true-fan-dice-roller-web
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Evita manifests de procedencia que confunden a algunos registries/hosts.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Backend: ejecutable nativo de Quarkus (sin JVM).
  #
  # El runner ubuntu-latest trae Docker Engine funcionando, así que:
  #   1. Maven (JDK 21) compila el bytecode en el runner.
  #   2. `container-build=true` ejecuta native-image dentro del builder image
  #      Mandrel 25 configurado en el perfil `native` del pom.xml.
  #   3. `Dockerfile.native` empaqueta el binario ELF resultante.
  # ---------------------------------------------------------------------------
  ws:
    name: Backend (nativo)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar Docker del runner
        run: |
          docker version
          docker info --format 'Memoria total: {{.MemTotal}} bytes'

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar binario nativo (Mandrel 25 en contenedor)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -Pnative -DskipTests \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime=docker

      - name: Verificar que el binario es Linux x86-64
        working-directory: backend
        run: |
          ls -lh target/*-runner
          file target/*-runner | tee /tmp/binary-info.txt
          grep -q 'ELF 64-bit' /tmp/binary-info.txt

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/true-fan-dice-roller-ws
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
