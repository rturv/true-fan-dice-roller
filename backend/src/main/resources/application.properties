# Development profile (default) - H2 in-memory
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:diceroller;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.jdbc.driver=org.h2.Driver
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=false

# Test profile - H2 in-memory
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:diceroller-test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.jdbc.driver=org.h2.Driver
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.diceroller.jwt.secret=test-secret-key-with-at-least-32-chars

# Production profile - PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/diceroller}
%prod.quarkus.hibernate-orm.schema-management.strategy=update



# JPA
quarkus.hibernate-orm.packages=es.rtur.truefan.diceroller.entity

# Health
quarkus.smallrye-health.root-path=/health

# CORS a nivel HTTP (cubre también /health/*, que no pasa por la pila JAX-RS)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Logging
quarkus.log.level=INFO

# JWT symmetric signing
# En dev/test se permite un secreto por defecto; en prod es obligatorio
# definir JWT_SECRET y el arranque falla si no está presente.
diceroller.jwt.secret=${JWT_SECRET:diceroller-dev-secret-key-min-32chars!!}
%prod.diceroller.jwt.secret=${JWT_SECRET}
diceroller.jwt.expiry-minutes=60
diceroller.jwt.renewal-grace-minutes=10

# Limpieza de salas inactivas al arrancar el backend
# Se eliminan solo salas sin usuarios conectados cuya última actividad
# (lastSeenAt, último mensaje o createdAt) supere estas horas.
diceroller.rooms.cleanup.enabled=true
diceroller.rooms.cleanup.inactivity-hours=24

# Native image
# Necesario para TLS hacia PostgreSQL (Neon usa sslmode=require).
quarkus.ssl.native=true

quarkus.websocket.dispatch-to-worker=true

# SBOM embebido en el artefacto y en el binario nativo.
# Permite que syft/grype/trivy auditen las dependencias Java reales.
quarkus.cyclonedx.embedded.enabled=true
quarkus.cyclonedx.runtime-only=true
