# Development profile (default) - H2 in-memory
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:diceroller;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.jdbc.driver=org.h2.Driver
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=false

# Production profile - PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/diceroller}
%prod.quarkus.hibernate-orm.database.generation=update



# JPA
quarkus.hibernate-orm.packages=es.rtur.truefan.diceroller.entity

# Health
quarkus.smallrye-health.root-path=/health

# Logging
quarkus.log.level=INFO

quarkus.websocket.dispatch-to-worker=true
